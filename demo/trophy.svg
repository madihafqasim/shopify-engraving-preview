<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" role="img" aria-label="Timber trophy with a sanded panel for engraving">
  <defs>
    <linearGradient id="wood" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#b98a5e"/>
      <stop offset="0.5" stop-color="#cfa47a"/>
      <stop offset="1" stop-color="#b3835a"/>
    </linearGradient>
    <linearGradient id="base" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#6b4429"/>
      <stop offset="1" stop-color="#4e2f1b"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#e6c9a5"/>
      <stop offset="1" stop-color="#dcbb93"/>
    </linearGradient>
    <clipPath id="slab"><path d="M150 860V250a250 130 0 0 1 500 0v610z"/></clipPath>
  </defs>

  <rect width="800" height="1000" fill="#f4efe8"/>
  <ellipse cx="400" cy="965" rx="330" ry="18" fill="#000" opacity="0.08"/>

  <!-- upright slab -->
  <path d="M150 860V250a250 130 0 0 1 500 0v610z" fill="url(#wood)"/>
  <g clip-path="url(#slab)" fill="none" stroke="#9c6f47" stroke-opacity="0.35" stroke-width="3">
    <path d="M190 120c20 200-15 420 10 740"/>
    <path d="M250 110c-25 230 30 470 0 760"/>
    <path d="M330 100c25 260-30 500 5 780"/>
    <path d="M470 100c-20 240 35 480 0 780"/>
    <path d="M545 110c30 230-25 470 10 760"/>
    <path d="M615 140c-15 220 20 450-5 730"/>
    <ellipse cx="300" cy="420" rx="22" ry="48"/>
    <ellipse cx="300" cy="420" rx="10" ry="26"/>
    <ellipse cx="520" cy="300" rx="16" ry="36"/>
  </g>

  <!-- engraved star -->
  <path d="M400 205l22 45 50 7-36 35 9 49-45-24-45 24 9-49-36-35 50-7z" fill="#3a2414" opacity="0.75"/>
  <path d="M260 410h280" stroke="#3a2414" stroke-opacity="0.5" stroke-width="3"/>
  <path d="M300 430h200" stroke="#3a2414" stroke-opacity="0.35" stroke-width="2"/>

  <!-- sanded engraving panel: 22%,56% to 78%,72% of the image -->
  <rect x="170" y="545" width="460" height="190" rx="14" fill="url(#panel)"/>
  <rect x="170" y="545" width="460" height="190" rx="14" fill="none" stroke="#9c6f47" stroke-opacity="0.4" stroke-width="2"/>

  <!-- base -->
  <rect x="110" y="860" width="580" height="100" rx="10" fill="url(#base)"/>
  <rect x="110" y="860" width="580" height="12" fill="#000" opacity="0.15"/>
</svg>
